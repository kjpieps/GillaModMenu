name: Build GILLA Mod DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build Mod DLL
      run: dotnet build GillaModMenu.csproj --configuration Release

    - name: Upload Compiled Mod DLL
      uses: actions/upload-artifact@v4
      with:
        name: GillaModMenu-DLL
        path: bin/Release/netstandard2.1/GillaModMenu.dll
        
